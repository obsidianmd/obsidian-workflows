name: Obsidian Release

on:
  workflow_call:
    inputs:
      type:
        description: 'Project type: plugin, theme, or auto'
        type: string
        required: false
        default: 'auto'
      build:
        description:
          'Explicit build command override. Set to "false" to disable.'
        type: string
        required: false
        default: ''
      node-version:
        description: 'Node.js version (minimum: 20)'
        type: string
        required: false
        default: '24'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # No `cache:` here on purpose. setup-node throws when it cannot find a
      # lockfile matching the chosen package manager, which breaks repositories
      # that have no lockfile (most themes) or use pnpm.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Validate, build, and release
        uses: obsidianmd/obsidian-workflows@v1
        with:
          type: ${{ inputs.type }}
          mode: release
          build: ${{ inputs.build }}
          lint: 'true'
          scanner-lint: 'true'
          node-version: ${{ inputs.node-version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
